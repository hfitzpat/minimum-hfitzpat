image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 900000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo 123456789012345678\b\b\b\n"

[assert]
uart0_contains = "msh> 123456789012345\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
